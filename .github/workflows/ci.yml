name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version
      - name: Compile the icon
        # The same actool command as build.sh: the Icon Composer document needs Xcode 26 or later.
        run: |
          icon="$RUNNER_TEMP/icon"
          mkdir -p "$icon"
          xcrun actool Resources/AppIcon.icon --compile "$icon" --platform macosx --minimum-deployment-target 26.0 \
              --app-icon AppIcon --output-partial-info-plist "$icon/partial.plist" >/dev/null
          [[ -s "$icon/Assets.car" ]] || { echo "actool did not compile Resources/AppIcon.icon (needs Xcode 26 or later)." >&2; exit 1; }
      - name: Build
        run: swift build
      - name: Test
        run: swift test
